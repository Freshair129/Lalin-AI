# Permission for syncing the official Leanback local device id into DIAL.

[[permission]]
identifier = "allow-dial-set-device-id"
description = "Enables the dial_set_device_id command without any pre-configured scope."
commands.allow = ["dial_set_device_id"]

[[permission]]
identifier = "deny-dial-set-device-id"
description = "Denies the dial_set_device_id command."
commands.deny = ["dial_set_device_id"]
