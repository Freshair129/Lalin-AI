[package]
name = "lalin-play"
version = "1.0.0"
description = "Lalin Play local media player"
edition = "2021"

[features]
g3-test-app-data-dir = []

[lib]
name = "lalin_play_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "smart-medley-benchmark"
path = "../benchmarks/smart-medley/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.22.4"
walkdir = "2"
genesis-block-native = { package = "genesis-block-native", git = "https://github.com/Freshair129/GenesisBlock", rev = "14de32a5d94216ccf832509cd866eab89d9389d5", default-features = false }
sha2 = "0.11.1"
symphonia = { version = "=0.6.1", default-features = false, features = ["aac", "aiff", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }
rustfft = "=6.4.1"
tauri-plugin-opener = "2.7.2"
tauri-plugin-updater = "2.10.1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_RemoteDesktop",
  "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"

[workspace]
