# dashboard มาจากไฟล์ในโปรเจกต์ (อยู่ใน git) — แก้ผ่าน UI จะถูกเขียนทับตอน restart โดยตั้งใจ
apiVersion: 1
providers:
  - name: lalin
    folder: Lalin
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
