name: Pull request validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/src-tauri -> target
            apps/play-desktop/src-tauri -> target

      - name: Install workspace dependencies
        run: npm ci

      - name: Build Node workspaces
        run: npm run build:node

      - name: Frontend tests
        working-directory: apps/desktop
        run: npm test

      - name: Install Play frontend dependencies
        run: npm ci --prefix apps/play-desktop

      - name: Build Play frontend
        run: npm run build --prefix apps/play-desktop

      - name: Play frontend tests
        run: npm test --prefix apps/play-desktop

      - name: Build lite backend sidecar
        shell: pwsh
        run: ./tools/build/build_sidecar.ps1 -Profile lite -VenvPath "${{ github.workspace }}/apps/api/.venv-ci" -CreateIfMissing

      - name: Compile API
        run: ./apps/api/.venv-ci/Scripts/python.exe -m compileall -q apps/api/app

      - name: Backend tests
        working-directory: apps/api
        run: ./.venv-ci/Scripts/python.exe -m pytest

      - name: Check Tauri
        run: npm run check:tauri

      - name: Play native tests
        run: cargo test --manifest-path apps/play-desktop/src-tauri/Cargo.toml

      - name: Desktop native tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
