name: Release G-Music

on:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    permissions:
      contents: write
    runs-on: windows-latest
    env:
      # Windows runners default to a non-UTF-8 codepage (cp1252-family) for
      # anything that doesn't carry its own BOM/encoding cookie -- pip's own
      # requirements.txt parser hit this for real (apps/api/requirements.txt
      # has Thai comments). Forces UTF-8 mode for every Python process in
      # this job rather than fixing files one at a time as they're found.
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Verify updater signing secret
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: ./tools/verify/check_tauri_signing_key.ps1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install workspace deps
        run: npm ci

      # ต้อง build sidecar ก่อน tauri-action เสมอ — tauri.conf.json ประกาศ
      # externalBin ไว้ ถ้าไม่มีไฟล์ bundle จะล้มตอน bundle step. -Profile full เพราะ
      # นี่คือ build ที่จะแจกจริง (lib.rs ตั้ง GMUSIC_BACKEND_PROFILE=full ตอน spawn)
      #
      # ก่อน "Verify workspace" ด้วย — check:api ต้องมี venv จริงถึงจะรัน compileall ได้
      # และ -CreateIfMissing คือขั้นตอนเดียวที่สร้าง apps/api/.venv-ci บน runner สดใหม่
      - name: Build backend sidecar
        shell: pwsh
        run: ./tools/build/build_sidecar.ps1 -Profile full -VenvPath "${{ github.workspace }}/apps/api/.venv-ci" -CreateIfMissing

      # The smoke-test step inside build_sidecar.ps1 can warn without failing
      # the build (see the comment there) -- upload its raw output so a
      # warning is actually debuggable instead of vanishing with the runner.
      - name: Upload sidecar smoke logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sidecar-smoke-logs
          path: |
            apps/api/sidecar-smoke.log
            apps/api/sidecar-smoke.err
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify workspace
        run: npm run check:all

      - name: Frontend tests
        working-directory: apps/desktop
        run: npx vitest run

      - name: Backend tests
        shell: pwsh
        run: |
          if (Test-Path apps/api/tests) {
            & "${{ github.workspace }}/apps/api/.venv-ci/Scripts/python.exe" -m pip install pytest==8.3.4
            Set-Location apps/api
            & "${{ github.workspace }}/apps/api/.venv-ci/Scripts/python.exe" -m pytest
            if ($LASTEXITCODE -ne 0) { exit 1 }
          } else {
            Write-Host "apps/api/tests ยังไม่มี - ข้าม"
          }

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: v__VERSION__
          releaseName: "G-Music v__VERSION__"
          releaseBody: "ดูรายละเอียดการเปลี่ยนแปลงด้านล่าง"
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
