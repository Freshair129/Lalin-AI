name: Release G-Music

on:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install workspace deps
        run: npm ci

      # ต้อง build sidecar ก่อน tauri-action เสมอ — tauri.conf.json ประกาศ
      # externalBin ไว้ ถ้าไม่มีไฟล์ bundle จะล้มตอน bundle step. -Profile full เพราะ
      # นี่คือ build ที่จะแจกจริง (lib.rs ตั้ง GMUSIC_BACKEND_PROFILE=full ตอน spawn)
      #
      # ก่อน "Verify workspace" ด้วย — check:api ต้องมี venv จริงถึงจะรัน compileall ได้
      # และ -CreateIfMissing คือขั้นตอนเดียวที่สร้าง apps/api/.venv-ci บน runner สดใหม่
      - name: Build backend sidecar
        shell: pwsh
        run: ./tools/build/build_sidecar.ps1 -Profile full -VenvPath "${{ github.workspace }}/apps/api/.venv-ci" -CreateIfMissing

      - name: Verify workspace
        run: npm run check:all

      - name: Frontend tests
        working-directory: apps/desktop
        run: npx vitest run

      - name: Backend tests
        shell: pwsh
        run: |
          if (Test-Path apps/api/tests) {
            & "${{ github.workspace }}/apps/api/.venv-ci/Scripts/python.exe" -m pip install pytest==8.3.4
            Set-Location apps/api
            & "${{ github.workspace }}/apps/api/.venv-ci/Scripts/python.exe" -m pytest
            if ($LASTEXITCODE -ne 0) { exit 1 }
          } else {
            Write-Host "apps/api/tests ยังไม่มี - ข้าม"
          }

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: v__VERSION__
          releaseName: "G-Music v__VERSION__"
          releaseBody: "ดูรายละเอียดการเปลี่ยนแปลงด้านล่าง"
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
