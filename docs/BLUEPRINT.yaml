  - แก้ LUFS ตกหลัง FX → ใช้ pedalboard.Limiter
  - drag-connect node graph เต็ม (ตอนนี้ static)
  - dubbing วิดีโอเต็มไฟล์, Tauri sidecar, batch, export SRT/VTT
