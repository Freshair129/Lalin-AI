# BLUEPRINT.yaml — G-Music
# Machine-readable spec ของทั้งแอป (single source สำหรับ codegen/reference)
# sync กับ: PRD.md · SRS.md · SPEC.md · UI_SITEMAP.md · ROADMAP_MUSIC.md
# วันที่: 2026-06-29

meta:
  name: G-Music
  tagline: AI Audio Studio — โคลนเสียง · พากย์ · mastering · music remix (local-first)
  version: 0.1.0
  identifier: com.gmusic.app
  platform: windows            # win10/11 x64 เท่านั้น (v0.1)
  ui_language: th
  strategy: local-first + BYOM   # ดู COMPETITIVE_BRIEF.md

stack:
  backend:
    framework: FastAPI
    python: "3.11"             # บังคับ — torch/f5-tts ไม่มี wheel 3.12+
    server: uvicorn
    port: 8756
    venv: backend/.venv         # สร้างด้วย uv
  frontend:
    shell: Tauri v2
    ui: React 18 + TypeScript + Vite
    theme: cinemaro             # นีออนไลม์ — src/styles.css
  gpu:
    card: RTX 3060 12GB
    torch: 2.5.1+cu121
  llm:
    local: Ollama (รันอยู่แล้ว)
    cloud: [anthropic, openai, openrouter]
    switch: runtime hot-swap (factory.py)

# ── โมเดล ML ที่ใช้จริง ──────────────────────────────────────
models:
  tts:
    engine_primary: F5-TTS
    repo: VIZINTZOR/F5-TTS-THAI    # CC-BY-4.0 (commercial OK + attribution)
    arch: F5TTS_Base + vocos
    sample_rate: 24000
    engine_fallback: XTTS v2       # CPML (non-commercial), ไม่รองรับไทย
  asr:
    engine: faster-whisper
    size: large-v3
    device: cuda
  music:
    stem_split: demucs (htdemucs)  # MIT
    autotune: psola                # MIT → parselmouth (GPL)
    fx: pedalboard                 # GPLv3
    analysis: librosa              # BPM/key/time-stretch
    mastering: [matchering, pyloudnorm]  # GPLv3 / MIT

# ── Design tokens (Cinemaro) ─────────────────────────────────
design_tokens:
  accent: "#cdf23f"           # นีออนไลม์
  accent_text: "#0a0e14"      # ตัวอักษรบนพื้นไลม์ (เข้ม)
  purple: "#8b5cf6"           # waveform/track/port รอง
  bg: "#080b12"               # space dark + radial glow
  panel: "#11151f"
  radius: 16px
  pill_radius: 999px

# ── โครงสร้างหน้า (sitemap) ──────────────────────────────────
sitemap:
  shell:
    sidebar:
      width: 230
      logo: "🎙️ G-Music"
      bottom: [UpdateChecker, connection_status]
    content: dynamic            # เปลี่ยนตาม nav
    overlay: [update_dialog]
  shared_components:
    JobProgress: badge(⏳/⚙️/✅/❌) + progress_bar + audio_player + download + error
    UpdateChecker: ปุ่ม🔄 + overlay(version/notes/install/relaunch)
  global_state: [tab, online, brainName]   # App.tsx

# ── Views (nav tabs) ─────────────────────────────────────────
views:
  - id: voices
    icon: "🎤"
    label: คลังเสียง
    component: VoicesPanel.tsx
    status: done
    inputs: [name, ref_text, language(th|en), file(.wav)]
    api: ["GET /voices", "POST /voices", "DELETE /voices/{id}"]

  - id: tts
    icon: "🗣️"
    label: อ่านข้อความ
    component: TTSPanel.tsx
    status: done
    inputs: [text, voice_id, language(th|en), speed(0.5-1.5)]
    api: [POST /tts]
    output: JobProgress

  - id: dubbing
    icon: "🎬"
    label: พากย์เสียง
    component: DubbingPanel.tsx
    status: done
    inputs: [source_file(audio|video), voice_id, target_lang, translate(bool)]
    api: [POST /files/upload, POST /dubbing]
    output: JobProgress

  - id: mastering
    icon: "🎚️"
    label: Mastering
    component: MasteringPanel.tsx
    status: done
    inputs: ["source(upload)", "reference(upload?)", "lufs(-14|-16|-9)", "format(wav|mp3)"]
    api: [POST /mastering]
    output: JobProgress

  - id: remix
    icon: "🎵"
    label: Remix
    component: RemixPanel.tsx
    status: todo                # backend เสร็จ, UI กำลังทำ
    paradigm: node_workflow     # full-width canvas, สไตล์ Cinemaro
    api: [POST /music/remix]
    output: JobProgress
    nodes:                      # static graph (v1) ตาม pipeline จริง
      - id: source
        title: Source
        param: source_audio
        ui: upload(mp3|mp4|wav)
        ports_out: [audio]
      - id: beat
        title: Beat
        param: beat_audio
        ui: upload(mp3|mp4|wav)
        ports_out: [audio]
      - id: stem_split
        title: Stem Split
        engine: demucs
        ports_in: [audio]
        ports_out: [vocal, instrumental]
      - id: autotune
        title: Auto-tune
        engine: psola
        param: do_autotune(bool)
        ports_in: [vocal]
        ports_out: [vocal]
      - id: vocal_fx
        title: Vocal FX
        engine: pedalboard
        params: [do_fx(bool), reverb(0-1), delay(0-1)]
        ports_in: [vocal]
        ports_out: [vocal]
      - id: mix
        title: Mix
        params: [offset_ms(null=auto|number)]
        ports_in: [vocal, beat]
        ports_out: [mixed]
      - id: master
        title: Master
        param: target_lufs(-14|-16|-9)
        ports_in: [mixed]
        ports_out: [audio]
      - id: output
        title: Output
        ui: player + download
        readonly: true
        ports_in: [audio]

  - id: brain
    icon: "🧠"
    label: สมอง
    component: BrainPanel.tsx
    status: done
    inputs:
      toggle: [ollama, cloud]
      ollama: [model]
      cloud: [provider(anthropic|openai|openrouter), model, api_key(masked)]
    api: [GET /brain/config, POST /brain/config]

# ── REST API ─────────────────────────────────────────────────
api:
  base: http://127.0.0.1:8756
  ws_base: ws://127.0.0.1:8756
  endpoints:
    - {method: GET,    path: /health}
    - {method: GET,    path: /brain/config}
    - {method: POST,   path: /brain/config,        body: [provider, ollama_model, cloud_provider, cloud_model, cloud_api_key]}
    - {method: POST,   path: /brain/chat,          body: [messages, temperature, max_tokens, stream]}
    - {method: POST,   path: /brain/translate,     body: [text, target_lang, source_lang]}
    - {method: GET,    path: /voices}
    - {method: POST,   path: /voices,              body: "multipart: name, ref_text, language, file"}
    - {method: DELETE, path: "/voices/{id}"}
    - {method: POST,   path: /files/upload,        body: "multipart: file"}
    - {method: GET,    path: "/files/download/{name}"}
    - {method: POST,   path: /tts,                 body: [text, voice_id, language, speed],         returns: job_id}
    - {method: POST,   path: /dubbing,             body: [source_audio, voice_id, target_lang, translate, source_lang], returns: job_id}
    - {method: POST,   path: /mastering,           body: [source_audio, reference_audio, target_lufs, target_format], returns: job_id}
    - {method: POST,   path: /music/remix,         body: [source_audio, beat_audio, do_autotune, do_fx, offset_ms, reverb, delay, target_lufs], returns: job_id}
    - {method: GET,    path: /jobs}
    - {method: GET,    path: "/jobs/{id}"}
    - {method: WS,     path: "/jobs/ws/{id}",      streams: Job}
  job:
    states: [queued, running, done, error]
    fields: [id, kind, status, progress(0-1), message, result, error]

# ── Pipelines (backend) ──────────────────────────────────────
pipelines:
  asr:        {file: pipelines/asr.py, engine: faster-whisper, out: "segments[start,end,text]"}
  tts:        {file: pipelines/tts.py, engines: [f5, xtts], rule: "th→f5 เสมอ"}
  dubbing:    {file: pipelines/dubbing.py, flow: "ASR→translate→TTS→fit_duration→overlay"}
  mastering:  {file: pipelines/mastering.py, modes: [reference(matchering), auto(lufs)]}
  music:
    file: pipelines/music.py
    entry: run_remix
    flow: "to_wav→separate_stems(demucs)→detect bpm/key→time-stretch→autotune(psola)→vocal_fx(pedalboard)→phase_sync/offset→mix→master"
    proven: true                # ทดสอบผ่าน API จริงแล้ว
    progress_stages: {prep: 0.05, stem: 0.15, analyze: 0.55, autotune: 0.65, fx: 0.8, mix_master: 0.9}

# ── Update system ────────────────────────────────────────────
update:
  plugin: tauri-plugin-updater (v2)
  endpoint: github releases (latest.json)
  signing: minisign (keys/g-music.key, gitignored)
  flow: auto-check(เปิดแอป) → dialog → download → install → relaunch
  installer:
    target: nsis
    output: "G-Music_{version}_x64-setup.exe (~3.5MB) + .exe.sig"
    languages: [Thai, English]
    build: scripts/build_installer.ps1

# ── Gotchas (ดู CLAUDE.md) ───────────────────────────────────
gotchas:
  - "cp1252 console พิมพ์ไทยไม่ได้ → PYTHONIOENCODING=utf-8"
  - "Ollama cold-load >4min + แย่ง VRAM กับ ML models → keep_alive:0 ก่อนงานหนัก"
  - "thinking model <think> ตัดออกแล้วใน OllamaProvider"
  - "ffmpeg ใช้ imageio-ffmpeg (bundle) → utils/ffmpeg.py configure() ตอน boot"
  - "heavy ML deps = lazy import; music deps (demucs/psola/pedalboard) ติดตั้งแยก"

