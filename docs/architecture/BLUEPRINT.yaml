# BLUEPRINT.yaml — G-Music (legacy machine-readable blueprint — ดู docs/DOCS_INDEX.md)
# Machine-readable spec ของ endpoints/components (ไม่ใช่ IA ปัจจุบัน — ดู docs/design/LALIN_SITEMAP_SOT.md สำหรับ product IA)
# sync กับ: PRD.md · SRS.md · SPEC.md · ROADMAP_MUSIC.md (UI_SITEMAP.md ย้ายไป docs/archive/ แล้ว)
# วันที่: 2026-08-09 (resync กับ apps/api + apps/desktop หลัง repo migration — Lalin Studio shell 8 แท็บ + speech/runtime-status/voices-patch)

meta:
  name: G-Music
  tagline: AI Audio Studio — โคลนเสียง · พากย์ · mastering · music remix (local-first)
  version: 0.1.0
  identifier: com.gmusic.app
  platform: windows            # win10/11 x64 เท่านั้น (v0.1)
  ui_language: th
  strategy: local-first + BYOM   # ดู COMPETITIVE_BRIEF.md

stack:
  backend:
    framework: FastAPI
    python: "3.11"             # บังคับ — torch/f5-tts ไม่มี wheel 3.12+
    server: uvicorn
    port: 8756
    venv: backend/.venv         # สร้างด้วย uv
  frontend:
    shell: Tauri v2
    ui: React 18 + TypeScript + Vite
    state: zustand v5 (useRemixStore) + React context (EngineProvider → useClipEngine)
    node_canvas: "@xyflow/react v12 (React Flow) — canvas ของ RemixPanel"
    theme: cinemaro             # นีออนไลม์ — src/styles.css
  gpu:
    card: RTX 3060 12GB
    torch: 2.5.1+cu121
  llm:
    local: Ollama (รันอยู่แล้ว)
    cloud: [anthropic, openai, openrouter]
    switch: runtime hot-swap (factory.py)

# ── โมเดล ML ที่ใช้จริง ──────────────────────────────────────
models:
  tts:
    engine_primary: F5-TTS
    repo: VIZINTZOR/F5-TTS-THAI    # CC-BY-4.0 (commercial OK + attribution)
    arch: F5TTS_Base + vocos
    sample_rate: 24000
    engine_fallback: XTTS v2       # CPML (non-commercial), ไม่รองรับไทย
  asr:
    engine: faster-whisper
    size: large-v3
    device: cuda
  music:
    stem_split: demucs (htdemucs)  # MIT
    autotune: psola                # MIT → parselmouth (GPL)
    fx: pedalboard                 # GPLv3
    analysis: librosa              # BPM/key/time-stretch
    mastering: [matchering, pyloudnorm]  # GPLv3 / MIT

# ── Design tokens (Cinemaro) ─────────────────────────────────
design_tokens:
  accent: "#cdf23f"           # นีออนไลม์
  accent_text: "#0a0e14"      # ตัวอักษรบนพื้นไลม์ (เข้ม)
  purple: "#8b5cf6"           # waveform/track/port รอง
  bg: "#080b12"               # space dark + radial glow
  panel: "#11151f"
  radius: 16px
  pill_radius: 999px

# ── โครงสร้างหน้า (sitemap) — Lalin Studio shell (repo migration) ─
# Wave 2-5 DAW shell (10 แท็บแบน G-Music) ถูกแทนที่แล้วโดย App.tsx ปัจจุบัน
# ดู docs/design/LALIN_SITEMAP_SOT.md สำหรับ product-level IA; ที่นี่คือ implementation mapping
sitemap:
  shell:                       # apps/desktop/src/App.tsx — single window, 8 แท็บ + sub-tab panel
    commandbar: [File, Edit, View, Help]      # เมนูบนสุด — Edit/View/Help เป็น stub info เฉยๆ
    topbar: [brand "LALIN STUDIO", breadcrumb(Workspace›Project›current), global_search, backend_pill, model_pill, UpdateChecker]
    rail: icon nav 8 แท็บ (label ใต้ icon) — ดู views ด้านล่าง
    stage: dynamic              # arrange/library เต็มจอ (ไม่มี .stage-pad), ที่เหลือ .stage-pad
    studio_dock: StudioDock — mount บนแท็บ dubbing|mastering (ล่างจอ); arrange embed StudioDock เองใน RemixPanel
    runtime_footer: RuntimeFooter — telemetry(cpu/ram/gpu/vram) + activity ปุ่มเปิด ActivityOverlay + runtime.profile/model/agent
    backend_gate: BackendGate — บล็อกทุกแท็บจนกว่า useBackendReadiness().state === "ready" (poll GET /health)
    overlay: [update_dialog, activity_overlay, context_menu(คลิกขวา clip), dialog(prompt/confirm), node_designer]
  backend_profile:             # main.py — router ที่ mount ขึ้นกับ profile (apps/api)
    lite: [health, brain, voices, files, fs, packs, projects, jobs, agent, plugins, speech]   # ไม่โหลด ML หนัก — ใช้ตรวจ installer/packaging
    full: lite + [tts, dubbing, mastering, music]                                              # dev/source ปกติ
  global_state:
    app: [tab, activityOpen, menu]                              # App.tsx
    backend: useBackendReadiness() — poll /health, state(checking|ready|error), retry()
    runtime: useRuntimeActivity(enabled) — poll GET /runtime/status (telemetry+activity+runtime)
    engine: EngineProvider → useClipEngine (tracks/clips/undo แชร์ทุกแท็บ)   # store/engineContext.tsx
    remix: useRemixStore (zustand) — remix params + master-fx + layout       # store/useRemixStore.ts
  timeline_engine:             # apps/desktop/src/timeline/ — clip engine ล้วน (มี unit test)
    files: [clipModel.ts, grid.ts, ops.ts, peaks.ts, useClipEngine.ts]
    tests: [grid.test.ts, ops.test.ts, useClipEngine.test.ts]

# ── Views (rail tabs — เรียงตาม NAV ใน apps/desktop/src/App.tsx) ─
# id/label เปลี่ยนจาก Wave 2-5 (voices/tts/remix/files/market/queue/plugins/brain แบน 10 แท็บ)
# เป็น Lalin Studio 8 แท็บ + sub-tab panel — เฉพาะ dubbing/arrange/mastering/jobs/settings ที่ยัง 1:1 กับ component เดิม
views:
  - id: workspace
    icon: grid
    label: Workspace
    component: (inline WorkspacePanel — App.tsx, ไม่ใช่ไฟล์แยก)
    status: done
    purpose: หน้าแรก — continue work, recent projects, launcher ไปแท็บอื่น, active jobs (จาก runtime.activity)
    api: [GET /runtime/status]

  - id: voice
    icon: voices
    label: Voice Studio
    component: (inline VoiceStudioPanel — App.tsx) สลับ 3 แท็บย่อย
    status: done
    sub_tabs:
      - {label: Profile,          component: VoicesPanel.tsx,  inputs: [name, ref_text, language(th|en), file(.wav), consent(bool, required)], api: ["GET /voices", "POST /voices", "PATCH /voices/{id}", "DELETE /voices/{id}"]}
      - {label: "Text to speech", component: TTSPanel.tsx,     inputs: [text, voice_id, language(th|en), speed(0.5-1.5)], api: [POST /tts], output: JobProgress}
      - {label: "Agent Voice",    component: "(inline — App.tsx)", purpose: "toggle Speak Lalin replies; ต้องเลือก voice profile ที่ consent แล้วจากแท็บ Profile ก่อน"}

  - id: dubbing
    icon: dubbing
    label: Dubbing
    component: DubbingPanel.tsx
    status: done
    studio_dock: true            # StudioDock mount ล่างจอ
    inputs: [source_file(audio|video), voice_id, target_lang, translate(bool)]
    helper: เกลาบทให้พอดีเวลา — สมองเขียนประโยคใหม่ให้พูดทัน target_sec (tone formal|casual)
    api: [POST /files/upload, POST /dubbing, POST /dubbing/refine]
    output: JobProgress

  - id: arrange
    icon: remix
    label: Arrange
    component: RemixPanel.tsx
    status: done                # สตูดิโอเต็มจอ — canvas + dock + rack (เดิมชื่อ "remix"/id "remix")
    paradigm: node_workflow     # React Flow (@xyflow/react) full-width, สไตล์ Cinemaro
    layout:
      studio_dock: embedded     # RemixPanel เรียก <StudioDock embedded /> เอง — App.tsx ไม่ mount ซ้ำ
      left_dock: LibraryPanel | PropertiesPanel (สลับแท็บ, Splitter ปรับกว้าง)
      canvas: React Flow node graph + custom node จาก NodeDesigner (text|subpatch|lfo)
      bottom_rack: FxRack (Knob reverb/delay + autotune) · StemMixer (4-stem gains) · Meter (LUFS)
      project: บันทึก/โหลดผ่าน /projects (useProjectFile) + Dialog ตั้งชื่อ
    api: ["POST /music/remix", "POST /music/export", "GET/POST /projects", "GET/PUT/DELETE /projects/{pid}"]
    output: JobProgress + Waveform player
    nodes:                      # pipeline หลัก (ตรงกับ run_remix) — เพิ่ม custom node ได้
      - id: source
        title: Source
        param: source_audio
        ui: upload(mp3|mp4|wav)
        ports_out: [audio]
      - id: beat
        title: Beat
        param: beat_audio
        ui: upload(mp3|mp4|wav)
        ports_out: [audio]
      - id: stem_split
        title: Stem Split
        engine: demucs
        ports_in: [audio]
        ports_out: [vocal, instrumental]
      - id: autotune
        title: Auto-tune
        engine: psola
        params: [do_autotune(bool), autotune_strength(0-1, default 1.0), key_override(str|null)]
        ports_in: [vocal]
        ports_out: [vocal]
      - id: vocal_fx
        title: Vocal FX
        engine: pedalboard
        params: [do_fx(bool), reverb(0-1), delay(0-1), phrase_bars(int, default 0)]
        ports_in: [vocal]
        ports_out: [vocal]
      - id: mix
        title: Mix
        params: [offset_ms(null=auto|number), stem_gains(vocals|drums|bass|other)]
        ports_in: [vocal, beat]
        ports_out: [mixed]
      - id: master
        title: Master
        param: target_lufs(-14|-16|-9)
        ports_in: [mixed]
        ports_out: [audio]
      - id: output
        title: Output
        ui: player + download
        readonly: true
        ports_in: [audio]

  - id: mastering
    icon: mastering
    label: Mastering
    component: MasteringPanel.tsx
    status: done
    studio_dock: true
    inputs: ["source(upload)", "reference(upload?)", "lufs(-14|-16|-9)", "format(wav|mp3)"]
    api: [POST /mastering]
    output: JobProgress

  - id: library
    icon: files
    label: Library
    component: (inline LibraryHub — App.tsx) สลับ 3 แท็บย่อย, full-bleed (ไม่มี .stage-pad)
    status: done
    sub_tabs:
      - {label: Files,        component: FileManager.tsx,     purpose: "จัดการ workspace ฝั่ง backend — browse/สร้างโฟลเดอร์/เปลี่ยนชื่อ/ย้าย/ลบ/อัปโหลด", api: ["GET /fs", "POST /fs/folder", "POST /fs/rename", "POST /fs/move", "DELETE /fs", "POST /fs/upload"]}
      - {label: Marketplace,  component: MarketplacePanel.tsx, purpose: "แคตตาล็อก sample pack + ติดตั้ง (การ์ด Tilt, สถานะดาวน์โหลดจริงไม่จำลอง %) — mock in-memory", api: ["GET /packs", "GET /packs/{pack_id}", "POST /packs/{pack_id}/download"]}
      - {label: Plugins,      component: PluginsPanel.tsx,    purpose: "สถานะ optional deps (pedalboard|psola|matchering — GPL, BYOM) + คำสั่งติดตั้ง", api: ["GET /plugins", "POST /plugins/{name}/install"]}

  - id: jobs
    icon: doc
    label: Jobs
    component: BatchQueue.tsx
    status: done
    purpose: คิวประมวลผลแบบชุด — เพิ่มงานหลายชิ้น รันทีละงานตามลำดับ (useBatchQueue.ts)
    api: [ใช้ endpoint ของงานแต่ละชนิด + /jobs]

  - id: settings
    icon: brain
    label: Settings
    component: BrainPanel.tsx
    status: done
    inputs:
      toggle: [ollama, cloud]
      ollama: [model, base_url]
      cloud: [provider(anthropic|openai|openrouter), model, api_key(masked)]
    api: [GET /brain/config, POST /brain/config]

# ── Component registry (apps/desktop/src/components — Wave 2-5) ──
# view panels 10 ตัวอยู่ใน views ด้านบน (บาง sub_tab); ด้านล่างคือ component ที่เหลือทั้งหมด
components:
  studio_floor:                # timeline = พื้น DAW ถาวรของทั้งแอป
    - {component: StudioDock.tsx,          role: "พื้น timeline+transport เห็นทุกแท็บ studio — Splitter ปรับสูง, master-fx จาก useRemixStore, สลับ MixCopilot"}
    - {component: ClipTimeline.tsx,        role: "multitrack clip timeline — ลาก/snap/slice/fade clip, SVG waveform จาก peaks, meter+balance ต่อแทร็ก, อัดไมค์, รับ drop จาก Library"}
    - {component: Timeline.tsx,            role: "track strip รุ่น Wave 2.1 — ปัจจุบันใช้เป็นแหล่ง type TrackView (UI จริงคือ ClipTimeline)"}
    - {component: MixCopilot.tsx,          role: "แชทสั่ง mix ด้วยสมอง (WP 4.3) — POST /agent/act ได้ mutations เสนอ ผู้ใช้กดใช้จึง commit เข้า engine (undo ได้)"}
    - {component: MicRecorder.tsx,         role: "useMicRecorder (WP 3.1) — getUserMedia+MediaRecorder อัดเสียง → อัปโหลด → วางลงแทร็ก"}
  remix_studio:                # ประกอบร่างใน RemixPanel
    - {component: NodeDesigner.tsx,        role: "ออกแบบ custom node (text|subpatch|lfo) เพิ่มลง React Flow canvas"}
    - {component: LibraryPanel.tsx,        role: "คลัง asset — ลากไฟล์ไปวางบน timeline (dataTransfer payload)"}
    - {component: PropertiesPanel.tsx,     role: "dock แก้พารามิเตอร์ของ track ที่เลือก (แนว AudioNodes)"}
    - {component: FxRack.tsx,              role: "rack คุม vocal FX — Knob reverb/delay + toggle autotune (การ์ด Tilt)"}
    - {component: StemMixer.tsx,           role: "เฟดเดอร์ 4 stem (vocals|drums|bass|other) → ส่ง stem_gains ให้ run_remix"}
  meters_controls:
    - {component: Waveform.tsx,            role: "decode + วาด waveform พร้อมเล่น/seek"}
    - {component: Knob.tsx,                role: "ปุ่มหมุนพารามิเตอร์ (ลากแนวตั้ง) — ยังไม่มี double-click reset (มีใน Splitter)"}
    - {component: Meter.tsx,               role: "มิเตอร์ LUFS (integrated)"}
    - {component: StereoMeter.tsx,         role: "VU แท่ง L/R จาก AnalyserNode ขณะเล่น"}
    - {component: ChannelMeterBalance.tsx, role: "level meter L/R + ลากปรับ balance (-1..1), double-click กลับกลาง"}
  shell_utility:
    - {component: Splitter.tsx,            role: "เส้นลากย่อ/ขยาย panel แกน x|y แบบ DAW (double-click reset)"}
    - {component: Tilt.tsx,                role: "การ์ดเอียงตามเมาส์ — ปิดอัตโนมัติเมื่อ prefers-reduced-motion"}
    - {component: ContextMenu.tsx,         role: "เมนูคลิกขวา generic (ใช้กับ clip บน timeline)"}
    - {component: Dialog.tsx,              role: "modal prompt/confirm แทน window.prompt (useDialogHost)"}
    - {component: JobProgress.tsx,         role: "badge สถานะ (⏳/⚙️/✅/❌) + progress bar + player + download + error"}
    - {component: UpdateChecker.tsx,       role: "ปุ่มเช็คอัปเดต + overlay version/notes/ติดตั้ง/relaunch"}
    - {component: icons.tsx,               role: "ชุด line icon (stroke=currentColor) สำหรับ rail/nav"}

# ── REST API ─────────────────────────────────────────────────
api:
  base: http://127.0.0.1:8756
  ws_base: ws://127.0.0.1:8756
  endpoints:
    # core + brain + runtime (lite profile — mount เสมอ)
    - {method: GET,    path: /health,               returns: "status, service, brain{...}, brain_config"}
    - {method: GET,    path: /runtime/status,       returns: "telemetry(cpu/ram/gpu/vram, null ถ้าไม่มี probe) + runtime(profile/model/agent) + activity(job ล่าสุดที่ queued|running)"}
    - {method: GET,    path: /brain/config}
    - {method: POST,   path: /brain/config,        body: [provider, ollama_base_url, ollama_model, cloud_provider, cloud_model, cloud_api_key]}
    - {method: POST,   path: /brain/chat,          body: [messages, temperature, max_tokens, stream]}
    - {method: POST,   path: /brain/translate,     body: [text, target_lang, source_lang]}
    - {method: POST,   path: /agent/act,           body: [message, project],          returns: "reply + mutations[op,args] — เสนอแก้ timeline ให้ frontend commit เอง (ไม่ execute)"}
    - {method: GET,    path: /speech/config,        returns: "asr_model, asr_device, asr_compute_type, profiles[], asr_available, tts_available (available=false ใน lite profile)"}
    - {method: POST,   path: /speech/config,        body: [model],                     returns: "{ok, asr_model} หรือ {ok:false, error} ถ้า model ไม่รู้จัก/lite profile"}
    # voices
    - {method: GET,    path: /voices}
    - {method: POST,   path: /voices,              body: "multipart: name, ref_text, language, consent(required), source, file",  note: "422 ถ้า consent ไม่ true"}
    - {method: PATCH,  path: "/voices/{id}",        body: [name, ref_text, language],  note: "ทุกฟิลด์ optional"}
    - {method: DELETE, path: "/voices/{id}"}
    # files (uploads/ + outputs/)
    - {method: POST,   path: /files/upload,        body: "multipart: file"}
    - {method: GET,    path: "/files/download/{name}"}
    - {method: GET,    path: "/files/input/{name}"}     # เสิร์ฟไฟล์จาก uploads/ (เช่นให้ frontend วาด waveform)
    - {method: GET,    path: "/files/export/{name}",    query: "fmt=wav|mp3 (mp3 แปลงด้วย ffmpeg ฝังในตัว 320k)"}
    # fs — workspace ของ FileManager (กัน path traversal ทุก endpoint)
    - {method: GET,    path: /fs,                  query: "path (rel ใน workspace)", returns: "entries[name,type,size,modified,ext]"}
    - {method: POST,   path: /fs/folder,           body: [path, name]}
    - {method: POST,   path: /fs/rename,           body: [path, name]}
    - {method: POST,   path: /fs/move,             body: [src, dst]}
    - {method: DELETE, path: /fs,                  query: path}
    - {method: POST,   path: /fs/upload,           body: "multipart: path, file"}
    # งาน ML (รันผ่าน jobs.spawn + WS progress)
    - {method: POST,   path: /tts,                 body: [text, voice_id, language, speed],         returns: job_id}
    - {method: POST,   path: /dubbing,             body: [source_audio, voice_id, target_lang, translate, source_lang], returns: job_id}
    - {method: POST,   path: /dubbing/refine,      body: [text, target_sec, tone(formal|casual)],   returns: refined}   # เกลาบทให้พอดีเวลา (สมองพัง→คืนข้อความเดิม)
    - {method: POST,   path: /mastering,           body: [source_audio, reference_audio, target_lufs, target_format], returns: job_id}
    - {method: POST,   path: /music/remix,         body: [source_audio, beat_audio, do_autotune, autotune_strength, key_override, do_fx, phrase_bars, offset_ms, reverb, delay, target_lufs, stem_gains], returns: job_id}
    - {method: POST,   path: /music/export,        body: [name, fmt(wav|mp3), reverb, echo, comp],  returns: job_id}    # เบค master FX (apply_master_fx) จากไฟล์ใน outputs/
    - {method: GET,    path: /jobs}
    - {method: GET,    path: "/jobs/{id}"}
    - {method: WS,     path: "/jobs/ws/{id}",      streams: Job}
    # projects — บันทึก/โหลด workspace (แชร์ข้ามเครื่องที่ต่อ backend เดียวกัน)
    - {method: GET,    path: /projects,            returns: "projects[id,name]"}
    - {method: POST,   path: /projects,            body: [name, data],                returns: id}
    - {method: GET,    path: "/projects/{pid}"}
    - {method: PUT,    path: "/projects/{pid}",    body: [name, data]}
    - {method: DELETE, path: "/projects/{pid}"}
    # marketplace + plugins (BYOM)
    - {method: GET,    path: /packs,               returns: "packs[] + installed (mock in-memory)"}
    - {method: GET,    path: "/packs/{pack_id}"}
    - {method: POST,   path: "/packs/{pack_id}/download"}
    - {method: GET,    path: /plugins,             returns: "สถานะ available ต่อ dep (pedalboard|psola|matchering) + license"}
    - {method: POST,   path: "/plugins/{name}/install",  returns: "คำสั่ง uv pip install (ยังไม่รัน pip จริง)"}
  errors:                          # สัญญา error ร่วม (รายละเอียดใน docs/product/SRS.md §5.1)
    fs: {out_of_root: 400, not_found: 404, name_conflict: 409, delete_root: 400}
    projects: {bad_pid: 404, not_found: 404, delete: idempotent}   # pid มี / \ .. -> 404 (กัน traversal)
    voices: {no_consent: 422, unreadable_audio: 422, not_found: 404}
    speech: "โปรไฟล์ lite ตอบ {ok:false, error:asr_unavailable_in_lite} — HTTP ยังเป็น 200"
  agent:                           # POST /agent/act — ดู SRS FR-14
    contract: propose-only          # ไม่แก้ project เอง — frontend commit() แบบ undo ได้
    read_tools: [get_project_state, analyze_project]   # ตอบ deterministic ผ่าน context (ไม่ round-trip)
    write_tools: [move_clip, set_gain, set_pan, set_fx, set_lufs, mute_clip, slice_clip, reorder_track]
    invalid_mutation: drop_silently # op ไม่รู้จัก/args ไม่ครบ -> ตัดทิ้ง ไม่ error
  job:
    states: [queued, running, done, error]
    fields: [id, kind, status, progress(0-1), message, result, error]
    cancel: none                    # ยังไม่มี endpoint ยกเลิก -> batch queue pause ได้แค่ "หยุดหลังงานปัจจุบันเสร็จ"

# ── Pipelines (backend) ──────────────────────────────────────
pipelines:
  asr:        {file: pipelines/asr.py, engine: faster-whisper, out: "segments[start,end,text]"}
  tts:        {file: pipelines/tts.py, engines: [f5, xtts], rule: "th→f5 เสมอ"}
  dubbing:    {file: pipelines/dubbing.py, flow: "ASR→translate→TTS→fit_duration→overlay", helper: refine_line_for_duration}
  mastering:  {file: pipelines/mastering.py, modes: [reference(matchering), auto(lufs)]}
  music:
    file: pipelines/music.py
    entry: run_remix
    flow: "to_wav→separate_stems(demucs)→detect bpm/key→time-stretch→autotune(psola)→vocal_fx(pedalboard)→phase_sync/offset→mix→master"
    proven: true                # ทดสอบผ่าน API จริงแล้ว
    stem_gains: "แยก 4 stem (vocals/drums/bass/other) เมื่อส่ง stem_gains — ไม่ส่ง = two-stems เร็วกว่า"
    limiter: pedalboard.Limiter # กันพีคหลัง normalize LUFS (brickwall)
    export: "apply_master_fx — เบค reverb/echo/comp ลงไฟล์ (POST /music/export)"
    progress_stages: {prep: 0.05, stem: 0.15, analyze: 0.55, autotune: 0.65, fx: 0.8, mix_master: 0.9}

# ── Update system ────────────────────────────────────────────
update:
  plugin: tauri-plugin-updater (v2)
  endpoint: github releases (latest.json)
  signing: minisign (keys/g-music.key, gitignored)
  flow: auto-check(เปิดแอป) → dialog → download → install → relaunch
  installer:
    target: nsis
    output: "G-Music_{version}_x64-setup.exe (~3.5MB) + .exe.sig"
    languages: [Thai, English]
    build: tools/build/build_installer.ps1

# ── Gotchas (ดู CLAUDE.md) ───────────────────────────────────
gotchas:
  - "cp1252 console พิมพ์ไทยไม่ได้ → PYTHONIOENCODING=utf-8"
  - "Ollama cold-load >4min + แย่ง VRAM กับ ML models → keep_alive:0 ก่อนงานหนัก"
  - "thinking model <think> ตัดออกแล้วใน OllamaProvider"
  - "ffmpeg ใช้ imageio-ffmpeg (bundle) → utils/ffmpeg.py configure() ตอน boot"
  - "heavy ML deps = lazy import; music deps (demucs/psola/pedalboard) ติดตั้งแยก"

