# BLUEPRINT.yaml — G-Music
# Machine-readable spec ของทั้งแอป (single source สำหรับ codegen/reference)
# sync กับ: PRD.md · SRS.md · SPEC.md · UI_SITEMAP.md · ROADMAP_MUSIC.md
# วันที่: 2026-06-29

meta:
  name: G-Music
  tagline: AI Audio Studio — โคลนเสียง · พากย์ · mastering · music remix (local-first)
  version: 0.1.0
  identifier: com.gmusic.app
  platform: windows            # win10/11 x64 เท่านั้น (v0.1)
  ui_language: th
  strategy: local-first + BYOM   # ดู COMPETITIVE_BRIEF.md

stack:
  backend:
    framework: FastAPI
    python: "3.11"             # บังคับ — torch/f5-tts ไม่มี wheel 3.12+
    server: uvicorn
    port: 8756
    venv: backend/.venv         # สร้างด้วย uv
  frontend:
    shell: Tauri v2
    ui: React 18 + TypeScript + Vite
    theme: cinemaro             # นีออนไลม์ — src/styles.css
  gpu:
    card: RTX 3060 12GB
    torch: 2.5.1+cu121
  llm:
    local: Ollama (รันอยู่แล้ว)
    cloud: [anthropic, openai, openrouter]
    switch: runtime hot-swap (factory.py)

# ── โมเดล ML ที่ใช้จริง ──────────────────────────────────────
models:
  tts:
    engine_primary: F5-TTS
    repo: VIZINTZOR/F5-TTS-THAI    # CC-BY-4.0 (commercial OK + attribution)
    arch: F5TTS_Base + vocos
    sample_rate: 24000
    engine_fallback: XTTS v2       # CPML (non-commercial), ไม่รองรับไทย
  asr:
    engine: faster-whisper
    size: large-v3
    device: cuda
  music:
    stem_split: demucs (htdemucs)  # MIT
    autotune: psola                # MIT → parselmouth (GPL)
    fx: pedalboard                 # GPLv3
    analysis: librosa              # BPM/key/time-stretch
    mastering: [matchering, pyloudnorm]  # GPLv3 / MIT

# ── Design tokens (Cinemaro) ─────────────────────────────────
design_tokens:
  accent: "#cdf23f"           # นีออนไลม์
  accent_text: "#0a0e14"      # ตัวอักษรบนพื้นไลม์ (เข้ม)
  purple: "#8b5cf6"           # waveform/track/port รอง
  bg: "#080b12"               # space dark + radial glow
  panel: "#11151f"
  radius: 16px
  pill_radius: 999px

# ── โครงสร้างหน้า (sitemap) ──────────────────────────────────
sitemap:
  shell:
    sidebar:
      width: 230
      logo: "🎙️ G-Music"
      bottom: [UpdateChecker, connection_status]
    content: dynamic            # เปลี่ยนตาม nav
    overlay: [update_dialog]
  global_state: [tab, online, brainName]   # App.tsx
  stale_note: >
    บล็อก shell + views ด้านล่างยังเป็นของยุค G-Music (sidebar 230px, 6 แท็บ)
    ปัจจุบัน apps/desktop/src/App.tsx ใช้ 8 แท็บ (workspace·voice·dubbing·arrange·
    mastering·library·jobs·settings) — SoT ของ nav อยู่ที่ docs/design/LALIN_SITEMAP_SOT.md
    ส่วน section components: ด้านล่างสแกนตรงกับโค้ดจริงแล้ว

# ── Component registry (ที่ไม่ใช่ view) — รายละเอียดใน docs/design/COMPONENT_REGISTRY.md ──
components:
  panels:                       # panel ระดับ view ที่ App.tsx ประกอบเข้าแท็บ (8 แท็บ — ดู LALIN_SITEMAP_SOT.md)
    - {component: VoicesPanel.tsx,      tab: voice,     used_by: "App.tsx > VoiceStudioPanel", role: "คลังเสียงอ้างอิง (consent-first)", req: FR-01}
    - {component: TTSPanel.tsx,         tab: voice,     used_by: "App.tsx > VoiceStudioPanel", role: "สังเคราะห์เสียง/โคลน", req: FR-02}
    - {component: DubbingPanel.tsx,     tab: dubbing,   used_by: App.tsx, role: "พากย์เสียง", req: FR-03}
    - {component: MasteringPanel.tsx,   tab: mastering, used_by: App.tsx, role: "มาสเตอร์", req: FR-04}
    - {component: RemixPanel.tsx,       tab: arrange,   used_by: App.tsx, role: "node workflow + timeline (เรนเดอร์ StudioDock เอง)", req: FR-04b}
    - {component: FileManager.tsx,      tab: library,   used_by: "App.tsx > LibraryHub", role: "จัดการไฟล์ใน data/workspace", req: FR-15}
    - {component: MarketplacePanel.tsx, tab: library,   used_by: "App.tsx > LibraryHub", role: "แคตตาล็อก sample pack (mock)", req: FR-11.4}
    - {component: PluginsPanel.tsx,     tab: library,   used_by: "App.tsx > LibraryHub", role: "สถานะ optional dep + คำสั่งติดตั้ง (เตือน license)", req: FR-11}
    - {component: BatchQueue.tsx,       tab: jobs,      used_by: App.tsx, role: "คิวประมวลผลชุด (pause = หยุดหลังงานปัจจุบัน)", req: FR-13}
    - {component: BrainPanel.tsx,       tab: settings,  used_by: App.tsx, role: "สลับ Ollama <-> Cloud สด", req: FR-05}
  workspace:                    # FR-09 — DAW core
    - {component: StudioDock.tsx,      used_by: [App.tsx, RemixPanel.tsx], role: "พื้น DAW: ห่อ ClipTimeline + ปุ่ม Copilot + context menu ของ clip; สูงลากได้ 130-620"}
    - {component: ClipTimeline.tsx,    used_by: StudioDock.tsx, role: "timeline หลัก: grid/ลาก/slice/fade/playback/loop/metronome/master FX"}
    - {component: Timeline.tsx,        used_by: none,           role: "มุมมองรุ่นแรก — ไม่ถูกเรนเดอร์แล้ว เหลือไว้เป็นแหล่ง type TrackView", status: deprecated}
    - {component: PropertiesPanel.tsx, used_by: RemixPanel.tsx, role: "แก้พารามิเตอร์ของ track ที่เลือก (mute/solo/lock + export)"}
    - {component: LibraryPanel.tsx,    used_by: RemixPanel.tsx, role: "คลัง sample/pack ลากไปวางบน timeline (CLIP_DRAG_MIME + LibraryDragPayload)"}
    - {component: StemMixer.tsx,       used_by: RemixPanel.tsx, role: "เฟดเดอร์แยก stem 0-1.5x -> stem_gains", req: FR-09.9}
    - {component: FxRack.tsx,          used_by: RemixPanel.tsx, role: "แร็ค FX: autotune/vocal FX/offset/LUFS/master FX"}
    - {component: MicRecorder.tsx,     used_by: ClipTimeline.tsx, role: "hook useMicRecorder() + MicRecordIndicator", req: FR-12}
  ai:
    - {component: MixCopilot.tsx,      used_by: StudioDock.tsx, role: "UI ของ propose-only agent — ยืนยัน mutation ก่อน commit (undo ได้)", req: FR-14}
  controls:                     # atoms: มิเตอร์ + คอนโทรล
    - {component: Knob.tsx,               used_by: [FxRack.tsx, RemixPanel.tsx], role: "ลูกบิด SVG ลากแนวตั้ง"}
    - {component: Meter.tsx,              used_by: RemixPanel.tsx,               role: "มิเตอร์ค่าเดี่ยว (ดีฟอลต์ LUFS)"}
    - {component: StereoMeter.tsx,        used_by: ClipTimeline.tsx,             role: "มิเตอร์ L/R จาก AnalyserNode"}
    - {component: ChannelMeterBalance.tsx, used_by: ClipTimeline.tsx,            role: "มิเตอร์ L/R + ลากปรับ pan (-1..1) ในตัวเดียว"}
    - {component: Waveform.tsx,           used_by: RemixPanel.tsx,               role: "วาด waveform จาก URL"}
  primitives:                   # shell / UI ทั่วไป
    - {component: JobProgress.tsx,   used_by: [TTSPanel.tsx, DubbingPanel.tsx, MasteringPanel.tsx, MixCopilot.tsx], role: "badge + progress bar + player + download + error", req: FR-06}
    - {component: UpdateChecker.tsx, used_by: App.tsx,                            role: "ตรวจอัปเดต + overlay dialog", req: FR-08}
    - {component: ContextMenu.tsx,   used_by: [StudioDock.tsx, FileManager.tsx],  role: "เมนูคลิกขวา (icon/shortcut/danger/sep)"}
    - {component: Dialog.tsx,        used_by: RemixPanel.tsx,                     role: "hook useDialogHost() แทน window.prompt/confirm"}
    - {component: Splitter.tsx,      used_by: [StudioDock.tsx, RemixPanel.tsx],   role: "ลากย่อ/ขยาย panel (axis x|y, double-click reset)"}
    - {component: Tilt.tsx,          used_by: [FxRack.tsx, MarketplacePanel.tsx], role: "parallax เอียงตามเมาส์ (เอฟเฟกต์ล้วน)"}
    - {component: icons.tsx,         used_by: [App.tsx, ClipTimeline.tsx, ContextMenu.tsx, FileManager.tsx, LibraryPanel.tsx, RemixPanel.tsx], role: "ชุด line icon <Icon name size />"}
  remix_node_ui:
    - {component: NodeDesigner.tsx,  used_by: RemixPanel.tsx, role: "ออกแบบโหนดเอง -> CustomNodeConfig (ก้าวแรกสู่ drag-connect graph)"}

# ── Views (nav tabs) — ⚠️ ยุค G-Music; ดู stale_note ด้านบน ────
views:
  - id: voices
    icon: "🎤"
    label: คลังเสียง
    component: VoicesPanel.tsx
    status: done
    inputs: [name, ref_text, language(th|en), file(.wav)]
    api: ["GET /voices", "POST /voices", "DELETE /voices/{id}"]

  - id: tts
    icon: "🗣️"
    label: อ่านข้อความ
    component: TTSPanel.tsx
    status: done
    inputs: [text, voice_id, language(th|en), speed(0.5-1.5)]
    api: [POST /tts]
    output: JobProgress

  - id: dubbing
    icon: "🎬"
    label: พากย์เสียง
    component: DubbingPanel.tsx
    status: done
    inputs: [source_file(audio|video), voice_id, target_lang, translate(bool)]
    api: [POST /files/upload, POST /dubbing]
    output: JobProgress

  - id: mastering
    icon: "🎚️"
    label: Mastering
    component: MasteringPanel.tsx
    status: done
    inputs: ["source(upload)", "reference(upload?)", "lufs(-14|-16|-9)", "format(wav|mp3)"]
    api: [POST /mastering]
    output: JobProgress

  - id: remix
    icon: "🎵"
    label: Remix
    component: RemixPanel.tsx
    status: todo                # backend เสร็จ, UI กำลังทำ
    paradigm: node_workflow     # full-width canvas, สไตล์ Cinemaro
    api: [POST /music/remix]
    output: JobProgress
    nodes:                      # static graph (v1) ตาม pipeline จริง
      - id: source
        title: Source
        param: source_audio
        ui: upload(mp3|mp4|wav)
        ports_out: [audio]
      - id: beat
        title: Beat
        param: beat_audio
        ui: upload(mp3|mp4|wav)
        ports_out: [audio]
      - id: stem_split
        title: Stem Split
        engine: demucs
        ports_in: [audio]
        ports_out: [vocal, instrumental]
      - id: autotune
        title: Auto-tune
        engine: psola
        param: do_autotune(bool)
        ports_in: [vocal]
        ports_out: [vocal]
      - id: vocal_fx
        title: Vocal FX
        engine: pedalboard
        params: [do_fx(bool), reverb(0-1), delay(0-1)]
        ports_in: [vocal]
        ports_out: [vocal]
      - id: mix
        title: Mix
        params: [offset_ms(null=auto|number)]
        ports_in: [vocal, beat]
        ports_out: [mixed]
      - id: master
        title: Master
        param: target_lufs(-14|-16|-9)
        ports_in: [mixed]
        ports_out: [audio]
      - id: output
        title: Output
        ui: player + download
        readonly: true
        ports_in: [audio]

  - id: brain
    icon: "🧠"
    label: สมอง
    component: BrainPanel.tsx
    status: done
    inputs:
      toggle: [ollama, cloud]
      ollama: [model]
      cloud: [provider(anthropic|openai|openrouter), model, api_key(masked)]
    api: [GET /brain/config, POST /brain/config]

# ── REST API ─────────────────────────────────────────────────
api:
  base: http://127.0.0.1:8756
  ws_base: ws://127.0.0.1:8756
  endpoints:
    - {method: GET,    path: /health}
    - {method: GET,    path: /brain/config}
    - {method: POST,   path: /brain/config,        body: [provider, ollama_model, cloud_provider, cloud_model, cloud_api_key]}
    - {method: POST,   path: /brain/chat,          body: [messages, temperature, max_tokens, stream]}
    - {method: POST,   path: /brain/translate,     body: [text, target_lang, source_lang]}
    - {method: GET,    path: /runtime/status,      returns: "{telemetry, runtime, activity}", note: "best-effort สำหรับ status bar — ไม่มี side effect"}
    - {method: GET,    path: /speech/config,       returns: "{asr_model, asr_device, asr_compute_type, profiles[], asr_available, tts_available}"}
    - {method: POST,   path: /speech/config,       body: [model], returns: "{ok, asr_model}"}
    - {method: GET,    path: /voices}
    - {method: POST,   path: /voices,              body: "multipart: name, ref_text, language, consent, source, file"}
    - {method: PATCH,  path: "/voices/{id}",       body: [name, ref_text, language]}
    - {method: DELETE, path: "/voices/{id}"}
    - {method: POST,   path: /files/upload,        body: "multipart: file"}
    - {method: GET,    path: "/files/download/{name}"}
    - {method: GET,    path: "/files/input/{name}",  note: "เสิร์ฟต้นฉบับจาก uploads/ (วาด waveform)"}
    - {method: GET,    path: "/files/export/{name}", query: [fmt(wav|mp3)]}
    - {method: POST,   path: /tts,                 body: [text, voice_id, language, speed],         returns: job_id}
    - {method: POST,   path: /dubbing,             body: [source_audio, voice_id, target_lang, translate, source_lang], returns: job_id}
    - {method: POST,   path: /dubbing/refine,      body: [text, target_sec, "tone(formal|casual)"], returns: refined}
    - {method: POST,   path: /mastering,           body: [source_audio, reference_audio, target_lufs, target_format], returns: job_id}
    - {method: POST,   path: /music/remix,         body: [source_audio, beat_audio, do_autotune, do_fx, offset_ms, reverb, delay, target_lufs, stem_gains], returns: job_id}
    - {method: POST,   path: /music/export,        body: [name, "fmt(wav|mp3)", reverb, echo, comp], returns: job_id}
    - {method: GET,    path: /jobs}
    - {method: GET,    path: "/jobs/{id}"}
    - {method: WS,     path: "/jobs/ws/{id}",      streams: Job}
    # ── Wave 2-5: projects · plugins · packs · fs · agent (ดู product/SRS.md §5.1) ──
    - {method: GET,    path: /projects,            returns: "projects[{id,name}]"}
    - {method: POST,   path: /projects,            body: [name, data], returns: "{id,name}"}
    - {method: GET,    path: "/projects/{pid}",    returns: "{id,name,data}"}
    - {method: PUT,    path: "/projects/{pid}",    body: [name, data], returns: "{id,name}"}
    - {method: DELETE, path: "/projects/{pid}",    returns: "{deleted}"}
    - {method: GET,    path: /plugins,             returns: "{name:{available,label,unlocks,license}}"}
    - {method: POST,   path: "/plugins/{name}/install", returns: "{name,command,note}", note: "คืนคำสั่ง ไม่รัน pip เอง"}
    - {method: GET,    path: /packs,               returns: "packs[{id,name,author,size_mb,color,desc,installed}]"}
    - {method: GET,    path: "/packs/{pack_id}"}
    - {method: POST,   path: "/packs/{pack_id}/download", returns: "{installed,id}"}
    - {method: GET,    path: /fs,                  query: [path], returns: "{path,entries[{name,type,size,modified,ext}]}"}
    - {method: POST,   path: /fs/folder,           body: [path, name]}
    - {method: POST,   path: /fs/rename,           body: [path, name]}
    - {method: POST,   path: /fs/move,             body: [src, dst]}
    - {method: DELETE, path: /fs,                  query: [path]}
    - {method: POST,   path: /fs/upload,           body: "multipart: path, file"}
    - {method: POST,   path: /agent/act,           body: [message, project], returns: "{reply, mutations[{op,args}]}"}
  errors:                          # สัญญา error ร่วม (ดู product/SRS.md §5.1)
    fs: {out_of_root: 400, not_found: 404, name_conflict: 409, delete_root: 400}
    projects: {bad_pid: 404, not_found: 404, delete: idempotent}
    voices: {no_consent: 422, unreadable_audio: 422, not_found: 404}
  agent:
    contract: propose-only          # ไม่แก้ project เอง — frontend commit() แบบ undo ได้
    read_tools: [get_project_state, analyze_project]   # ตอบ deterministic ผ่าน context
    write_tools: [move_clip, set_gain, set_pan, set_fx, set_lufs, mute_clip, slice_clip, reorder_track]
    invalid_mutation: drop_silently # op ไม่รู้จัก/args ไม่ครบ → ตัดทิ้ง ไม่ error
  backend_profile:                  # app.state.backend_profile
    full: "ASR/TTS ใช้ได้"
    lite: "/speech/config ปฏิเสธด้วย {ok:false, error:asr_unavailable_in_lite} (HTTP 200)"
  job:
    states: [queued, running, done, error]
    fields: [id, kind, status, progress(0-1), message, result, error]
    cancel: none                    # ยังไม่มี endpoint ยกเลิก → batch queue pause ได้แค่ "หยุดหลังงานปัจจุบันเสร็จ"

# ── Pipelines (backend) ──────────────────────────────────────
pipelines:
  asr:        {file: pipelines/asr.py, engine: faster-whisper, out: "segments[start,end,text]"}
  tts:        {file: pipelines/tts.py, engines: [f5, xtts], rule: "th→f5 เสมอ"}
  dubbing:    {file: pipelines/dubbing.py, flow: "ASR→translate→TTS→fit_duration→overlay"}
  mastering:  {file: pipelines/mastering.py, modes: [reference(matchering), auto(lufs)]}
  music:
    file: pipelines/music.py
    entry: run_remix
    flow: "to_wav→separate_stems(demucs)→detect bpm/key→time-stretch→autotune(psola)→vocal_fx(pedalboard)→phase_sync/offset→mix→master"
    proven: true                # ทดสอบผ่าน API จริงแล้ว
    progress_stages: {prep: 0.05, stem: 0.15, analyze: 0.55, autotune: 0.65, fx: 0.8, mix_master: 0.9}

# ── Update system ────────────────────────────────────────────
update:
  plugin: tauri-plugin-updater (v2)
  endpoint: github releases (latest.json)
  signing: minisign (keys/g-music.key, gitignored)
  flow: auto-check(เปิดแอป) → dialog → download → install → relaunch
  installer:
    target: nsis
    output: "G-Music_{version}_x64-setup.exe (~3.5MB) + .exe.sig"
    languages: [Thai, English]
    build: tools/build/build_installer.ps1

# ── Gotchas (ดู CLAUDE.md) ───────────────────────────────────
gotchas:
  - "cp1252 console พิมพ์ไทยไม่ได้ → PYTHONIOENCODING=utf-8"
  - "Ollama cold-load >4min + แย่ง VRAM กับ ML models → keep_alive:0 ก่อนงานหนัก"
  - "thinking model <think> ตัดออกแล้วใน OllamaProvider"
  - "ffmpeg ใช้ imageio-ffmpeg (bundle) → utils/ffmpeg.py configure() ตอน boot"
  - "heavy ML deps = lazy import; music deps (demucs/psola/pedalboard) ติดตั้งแยก"

# ── สิ่งที่ยังไม่ทำ ───────────────────────────────────────────
backlog:
  - RemixPanel.tsx (node workflow UI) + เพิ่มแท็บใน App.tsx
  - manual mixer (offset/FX sliders + preview) + stem fader
  - แก้ LUFS ตกหลัง FX → ใช้ pedalboard.Limiter
  - drag-connect node graph เต็ม (ตอนนี้ static)
  - dubbing วิดีโอเต็มไฟล์, Tauri sidecar, batch, export SRT/VTT
  - RVC singing voice conversion (consent-first + BYOM) — เฟสหลัง
